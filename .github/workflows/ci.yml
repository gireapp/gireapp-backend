name: Backend CI

# Every branch, not just main: the August 2026 compromise was force-pushed to
# staging and a feature branch, where no workflow was watching, and sat there
# for three weeks.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Before npm ci — installing runs lifecycle scripts, so anything injected
    # has to be found while the checkout is still inert.
    - name: Scan for injected code
      run: node backend/scripts/scan-injected-code.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Blocks on high/critical, minus the dated exceptions in
    # backend/scripts/audit-exceptions.json. Plain `npm audit --audit-level=high`
    # cannot express "build-time CLI, no request path", so keeping it meant
    # either lowering the bar for everything or deleting the gate.
    - name: Audit dependencies
      run: node backend/scripts/audit-gate.mjs

    - name: Build shared package
      run: npm run build --workspace=shared

    - name: Prisma Generate
      run: npm run db:generate --workspace=backend

    - name: Type Check
      run: npm run type-check --workspace=backend

    - name: Build
      run: npm run build --workspace=backend

    - name: Run Unit Tests
      run: npm run test --workspace=backend
