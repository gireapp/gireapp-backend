services:
  - type: web
    name: gireapp-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/health
    # Migrations run here because pre-deploy commands require a paid instance type.
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate:deploy --workspace=backend
    startCommand: npm run start
    envVars:
      # backend compiles to CommonJS while @gireapp/shared is ESM, so the runtime
      # needs require(esm) — unflagged only from Node 22.12 onward.
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLIENT_IP_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
