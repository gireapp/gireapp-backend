services:
  - type: web
    name: gireapp-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/health
    # Migrations run here because pre-deploy commands require a paid instance type.
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate:deploy --workspace=backend
    startCommand: npm run start
    envVars:
      # backend compiles to CommonJS while @gireapp/shared is ESM, so the runtime
      # needs require(esm) — unflagged only from Node 22.12 onward.
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
